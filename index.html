<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4ef">
<title>PIG ALARM</title>
<style>
:root{--bg:#f4f4ef;--card:#fff;--text:#111;--muted:#75756e;--line:#deded6;--soft:#ecece5}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{padding-bottom:max(44px,env(safe-area-inset-bottom))}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
main{max-width:760px;margin:0 auto;padding:20px 12px 48px}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--muted);margin:2px 2px 8px}
h1{font-size:30px;line-height:1;margin:0 2px 7px;font-weight:900;letter-spacing:-.055em}.intro{font-size:12px;line-height:1.65;color:var(--muted);margin:0 2px 16px}
.top{background:#111;color:#fff;border-radius:20px;padding:16px;margin-bottom:12px}.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.daylabel{font-size:10px;opacity:.55;letter-spacing:.1em;margin-bottom:5px}.daytitle{font-size:21px;font-weight:900;letter-spacing:-.035em}.daycopy{font-size:11px;line-height:1.55;opacity:.66;margin-top:5px}
.badge{background:#fff;color:#111;border-radius:999px;padding:7px 9px;font-size:10px;font-weight:850;white-space:nowrap}.topBtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.topBtn{border:1px solid rgba(255,255,255,.18);background:#292929;color:#fff;border-radius:10px;padding:10px 11px;font-size:11px;font-weight:800}.topBtn.primary{background:#fff;color:#111}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.stat{background:#e9e9e2;border-radius:13px;padding:11px}.stat small{display:block;font-size:9px;color:var(--muted);margin-bottom:3px}.stat b{font-size:13px}
.attendance{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:15px}.attHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.attHead b{font-size:13px}.attHead span{font-size:10px;color:var(--muted)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calDow,.calDay{height:31px;display:flex;align-items:center;justify-content:center;font-size:10px;border-radius:9px}.calDow{height:20px;color:var(--muted)}.calDay{background:var(--soft)}.calDay.empty{background:transparent}.calDay.done{background:#111;color:#fff;font-weight:850}.calDay.today{outline:1px solid #111;outline-offset:-1px}
.sessionNav{display:flex;gap:7px;overflow-x:auto;padding:0 1px 10px;margin-bottom:4px;scrollbar-width:none}.sessionNav::-webkit-scrollbar{display:none}.sessionBtn{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:800;color:#555}.sessionBtn.active{background:#111;color:#fff;border-color:#111}.sessionBtn.done:after{content:" ✓"}
.progressWrap{margin:0 2px 16px}.progressText{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}.progress{height:7px;border-radius:999px;background:#dddcd5;overflow:hidden}.progressBar{height:100%;width:0;background:#111;transition:width .2s}
.sectionLabel{display:flex;justify-content:space-between;align-items:center;margin:0 2px 9px}.sectionLabel b{font-size:13px}.sectionLabel span{font-size:10px;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:11px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;scroll-margin-top:10px}.head{display:flex;gap:10px}.num{width:27px;height:27px;border-radius:9px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:850;flex:none}
.name{font-size:16px;font-weight:900;letter-spacing:-.025em}.target{font-size:12px;color:var(--muted);margin-top:2px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.tag{background:var(--soft);font-size:9px;color:#555;border-radius:999px;padding:4px 6px}
.desc{font-size:12px;line-height:1.7;color:#3c3c37;margin:11px 0 0 37px}.control{margin:12px 0 0 37px;background:var(--soft);border-radius:13px;padding:11px}
.guide{min-height:78px;background:#fff;border:1px solid #d9d9d2;border-radius:11px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:9px}.phase{font-size:19px;font-weight:900}.sub{font-size:11px;color:var(--muted);margin-top:4px}
.options,.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;align-items:center}.opt,.btn{border:1px solid #d4d4cd;background:#fff;color:#111;border-radius:9px;padding:8px 10px;font-size:11px;font-weight:800}.opt.active,.btn.primary{background:#111;color:#fff;border-color:#111}
.timer{margin-left:auto;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}.sets{display:grid;grid-template-columns:repeat(var(--count,2),1fr);gap:6px;margin-top:8px}.set{height:39px;border:1px solid #d4d4cd;background:#fff;border-radius:9px;font-size:11px;font-weight:800}.set.done{background:#111;color:#fff;border-color:#111}
.completeBox{margin-top:15px;background:#111;color:#fff;border-radius:17px;padding:14px}.completeBox b{display:block;font-size:14px;margin-bottom:4px}.completeBox p{font-size:11px;line-height:1.55;opacity:.65;margin:0 0 11px}.completeBtn{width:100%;border:0;border-radius:11px;padding:12px;background:#fff;color:#111;font-size:12px;font-weight:900}
.footer{font-size:10px;line-height:1.65;color:var(--muted);margin:14px 2px 0}
@media(max-width:520px){main{padding:18px 11px 42px}h1{font-size:27px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.desc,.control{margin-left:0}.timer{width:100%;margin-left:0}}
</style>
</head>
<body>
<main>
<div class="eyebrow">PIG ALARM / HOME WORKOUT</div>
<h1>운동하자</h1>
<p class="intro">요일이 아니라 운동한 횟수 기준입니다. 12회차를 돌고 나면 강도와 순서를 살짝 바꿔 다시 이어집니다.</p>
<section class="top">
<div class="topline"><div><div class="daylabel">NEXT SESSION</div><div class="daytitle" id="dayTitle"></div><div class="daycopy" id="dayCopy"></div></div><div class="badge" id="durationBadge"></div></div>
<div class="topBtns"><button class="topBtn primary" id="startSession">운동 시작</button><button class="topBtn" id="cueToggle">UP / DOWN ON</button><button class="topBtn" id="cueTest">큐 테스트</button></div>
</section>
<section class="stats"><div class="stat"><small>이번 달</small><b id="monthCount">0회</b></div><div class="stat"><small>총 운동</small><b id="totalCount">0회</b></div><div class="stat"><small>최근 운동</small><b id="lastDate">-</b></div></section>
<section class="attendance"><div class="attHead"><b>출석</b><span id="calMonth"></span></div><div class="calendar" id="calendar"></div></section>
<div class="sessionNav" id="sessionNav"></div>
<div class="progressWrap"><div class="progressText"><span>진행률</span><span id="progressText"></span></div><div class="progress"><div class="progressBar" id="progressBar"></div></div></div>
<div class="sectionLabel"><b id="sectionTitle"></b><span id="cycleText"></span></div>
<section class="cards" id="cards"></section>
<section class="completeBox"><b>오늘 운동 끝</b><p>완료를 누르면 출석이 저장되고 다음 회차로 넘어갑니다.</p><button class="completeBtn" id="completeSession">운동 완료</button></section>
<div class="footer">팔과 손목에 체중을 싣는 동작은 제외했습니다. 생수병 동작은 500ml 정도만 기준으로 했고, 수술 부위에 날카로운 통증, 붓기, 저림이 생기면 해당 동작은 중단하세요.</div>
</main>
<script>
const BASE_SESSIONS=[{"day":1,"title":"1일차 · 하체 + 가벼운 팔","copy":"오늘 했던 구성 그대로","duration":"20-25분","exercises":[{"id":"squat","name":"템포 스쿼트","target":"10-12회 × 2세트","tags":["하체","엉덩이"],"kind":"reps","values":[10,12],"sets":2,"desc":"발은 어깨너비. 엉덩이를 뒤로 보내며 천천히 앉고 무릎은 발끝 방향을 유지합니다.","pattern":[["내려가기","down",2800],["유지","silent",450],["올라오기","up",1800]]},{"id":"hinge","name":"굿모닝 힙힌지","target":"12-15회 × 2세트","tags":["엉덩이","햄스트링"],"kind":"reps","values":[12,15],"sets":2,"desc":"무릎을 살짝 굽히고 엉덩이를 뒤로 보냅니다. 허리를 접기보다 고관절을 접는 느낌으로 진행합니다.","pattern":[["숙이기","down",2400],["일어나기","up",1800]]},{"id":"wallsit","name":"월싯","target":"30-40초 × 2세트","tags":["허벅지","근지구력"],"kind":"time","values":[30,40],"sets":2,"desc":"벽에 등을 기대고 편한 깊이에서 버팁니다. 무릎이 불편하면 깊이를 줄입니다."},{"id":"kneeup","name":"스탠딩 니업","target":"30-45초 × 2세트","tags":["유산소","코어"],"kind":"time","values":[30,45],"sets":2,"desc":"상체를 세우고 무릎을 번갈아 올립니다. 팔은 편하게 둡니다.","rhythm":700},{"id":"curl","name":"500ml 보틀 컬","target":"10-12회 × 2세트","tags":["팔","500ml"],"kind":"reps","values":[10,12],"sets":2,"desc":"팔꿈치를 몸 옆에 붙이고 생수병을 천천히 올렸다 내립니다. 손목은 꺾지 않습니다.","pattern":[["올리기","up",1800],["내리기","down",2200]]}]},{"day":2,"title":"2일차 · 코어 + 상체","copy":"복부와 가벼운 상체 중심","duration":"18-22분","exercises":[{"id":"heel","name":"90도 힐탭","target":"30-40초 × 2세트","tags":["복부","코어"],"kind":"time","values":[30,40],"sets":2,"desc":"누워서 무릎을 90도로 만들고 한쪽 발뒤꿈치씩 바닥 가까이 내렸다가 돌아옵니다.","rhythm":900},{"id":"sideknee","name":"스탠딩 사이드 니업","target":"좌우 8-10회 × 2세트","tags":["옆구리","코어"],"kind":"reps","values":[16,20],"sets":2,"desc":"한쪽 무릎을 옆으로 들어 올렸다 내립니다. 상체는 크게 기울이지 않습니다.","pattern":[["올리기","up",1200],["내리기","down",1200]]},{"id":"curl2","name":"500ml 보틀 컬","target":"10-12회 × 2세트","tags":["이두","500ml"],"kind":"reps","values":[10,12],"sets":2,"desc":"팔꿈치를 몸통 옆에 고정하고 통증 없는 범위에서 진행합니다.","pattern":[["올리기","up",1800],["내리기","down",2200]]},{"id":"front","name":"보틀 프론트 레이즈","target":"8-10회 × 2세트","tags":["어깨","500ml"],"kind":"reps","values":[8,10],"sets":2,"desc":"생수병을 몸 앞에서 어깨 높     if(c%2===0 && ex.pattern) ex.pattern=ex.pattern.map(p=>[p[0],p[1],Math.round(p[2]*1.06)]);
  });
  if(c%2===0 && base.exercises.length>4){const first=base.exercises.shift();base.exercises.splice(2,0,first)}
  base.copy=`${base.copy} · ${c}바퀴 변주`;
  return base;
}
function renderStats(){const n=new Date(),prefix=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;monthCount.textContent=state.attendance.filter(d=>d.startsWith(prefix)).length+'회';totalCount.textContent=state.totalSessions+'회';const last=[...state.attendance].sort().pop();lastDate.textContent=last?`${Number(last.slice(5,7))}.${Number(last.slice(8,10))}`:'-'}
function renderCalendar(){const n=new Date(),y=n.getFullYear(),m=n.getMonth();calMonth.textContent=`${y}.${String(m+1).padStart(2,'0')}`;calendar.innerHTML='';['일','월','화','수','목','금','토'].forEach(x=>{const d=document.createElement('div');d.className='calDow';d.textContent=x;calendar.appendChild(d)});const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),today=localDateStr();for(let i=0;i<first;i++){const d=document.createElement('div');d.className='calDay empty';calendar.appendChild(d)}for(let day=1;day<=days;day++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,d=document.createElement('div');d.className='calDay';d.textContent=day;if(state.attendance.includes(ds))d.classList.add('done');if(ds===today)d.classList.add('today');calendar.appendChild(d)}}
function renderNav(){sessionNav.innerHTML='';for(let i=1;i<=12;i++){const b=document.createElement('button');b.className='sessionBtn';b.textContent=`${i}일차`;if(i===currentDay)b.classList.add('active');if(state.cycle===1&&state.completedDays.includes(i))b.classList.add('done');b.onclick=()=>{stopActive();currentDay=i;render()};sessionNav.appendChild(b)}}
function render(){const s=cycleSession(currentDay);dayTitle.textContent=s.title;dayCopy.textContent=s.copy;durationBadge.textContent=s.duration;sectionTitle.textContent=`${s.day}일차 운동`;cycleText.textContent=state.cycle>1?`${state.cycle}바퀴째`:'위에서부터 순서대로';cards.innerHTML='';s.exercises.forEach((ex,i)=>cards.appendChild(makeCard(ex,i)));renderNav();renderProgress();renderStats();renderCalendar();setCueButton()}
function makeCard(ex,i){const a=document.createElement('article');a.className='card';a._ex=ex;a._timers=[];a.innerHTML=`<div class="head"><div class="num">${i+1}</div><div><div class="name">${ex.name}</div><div class="target">${ex.target}</div><div class="tags">${ex.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div></div><div class="desc">${ex.desc}</div><div class="control"><div class="guide"><div class="phase">준비</div><div class="sub">시작을 누르면 6초 준비 후 시작합니다.</div></div><div class="options">${ex.values.map((v,j)=>`<button class="opt ${j===0?'active':''}" data-v="${v}">${ex.kind==='time'?v+'초':v+'회'}</button>`).join('')}</div><div class="controls"><button class="btn primary start">세트 시작</button><button class="btn stop">정지</button><span class="timer">${ex.kind==='time'?fmt(ex.values[0]):'00:00'}</span></div><div class="sets" style="--count:${ex.sets}">${Array.from({length:ex.sets},(_,k)=>`<button class="set">${k+1}세트</button>`).join('')}</div></div>`;a.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{a.querySelectorAll('.opt').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(ex.kind==='time')a.querySelector('.timer').textContent=fmt(Number(b.dataset.v))});a.querySelector('.start').onclick=()=>startCard(a);a.querySelector('.stop').onclick=()=>stopCard(a,false);a.querySelectorAll('.set').forEach(b=>b.onclick=()=>{b.classList.toggle('done');renderProgress()});return a}
function clearTimers(a){(a._timers||[]).forEach(x=>{clearTimeout(x);clearInterval(x)});a._timers=[]}
function stopCard(a,quiet=true){if(!a)return;clearTimers(a);if(!quiet){a.querySelector('.phase').textContent='정지';a.querySelector('.sub').textContent='다시 시작할 수 있습니다.'}if(activeCard===a)activeCard=null}
function stopActive(){if(activeCard)stopCard(activeCard,true)}
function valueOf(a){return Number(a.querySelector('.opt.active').dataset.v)}
function startCard(a){getAudio();stopActive();activeCard=a;clearTimers(a);const ex=a._ex,phase=a.querySelector('.phase'),sub=a.querySelector('.sub'),timer=a.querySelector('.timer');let prep=6;phase.textContent='자세 준비';sub.textContent='6초';timer.textContent=fmt(prep);const it=setInterval(()=>{prep--;timer.textContent=fmt(Math.max(prep,0));sub.textContent=prep>0?prep+'초':'시작';if(prep<=0){clearInterval(it);a._timers=a._timers.filter(x=>x!==it);ex.kind==='time'?runTime(a):runReps(a)}},1000);a._timers.push(it)}
function finishSet(a){clearTimers(a);activeCard=null;const sets=[...a.querySelectorAll('.set')],next=sets.find(x=>!x.classList.contains('done'));if(next)next.classList.add('done');a.querySelector('.phase').textContent='세트 완료';a.querySelector('.sub').textContent=sets.every(x=>x.classList.contains('done'))?'이 운동 완료':'30초 쉬고 다음 세트';renderProgress()}
function runTime(a){const ex=a._ex,target=valueOf(a),phase=a.querySelector('.phase'),sub=a.querySelector('.sub'),timer=a.querySelector('.timer');let left=target,dir='up';phase.textContent='시작';sub.textContent=left+'초';timer.textContent=fmt(left);if(ex.rhythm){const tick=()=>{phase.textContent=dir==='up'?'UP':'DOWN';cue(dir,Math.min(700,ex.rhythm));dir=dir==='up'?'down':'up'};tick();const r=setInterval(tick,ex.rhythm);a._timers.push(r)}else phase.textContent='유지';const it=setInterval(()=>{left--;timer.textContent=fmt(Math.max(left,0));sub.textContent=Math.max(left,0)+'초';if(left<=0)finishSet(a)},1000);a._timers.push(it)}
function runReps(a){const ex=a._ex,target=valueOf(a),phase=a.querySelector('.phase'),sub=a.querySelector('.sub'),timer=a.querySelector('.timer');let rep=1,step=0,elapsed=0;const clock=setInterval(()=>{elapsed++;timer.textContent=fmt(elapsed)},1000);a._timers.push(clock);function next(){if(activeCard!==a)return;const p=ex.pattern[step];phase.textContent=p[0];sub.textContent=`${rep} / ${target}회`;cue(p[1],p[2]);const t=setTimeout(()=>{step++;if(step>=ex.pattern.length){if(rep>=target){finishSet(a);return}rep++;step=0;const gap=setTimeout(next,350);a._timers.push(gap)}else next()},p[2]);a._timers.push(t)}next()}
function renderProgress(){const list=[...document.querySelectorAll('.card')],done=list.filter(a=>[...a.querySelectorAll('.set')].every(x=>x.classList.contains('done'))).length;progressText.textContent=`${done} / ${list.length}`;progressBar.style.width=list.length?`${done/list.length*100}%`:'0%'}
function setCueButton(){cueToggle.textContent=state.cue?'UP / DOWN ON':'UP / DOWN OFF'}
cueToggle.onclick=()=>{state.cue=!state.cue;save();setCueButton()};
cueTest.onclick=()=>{getAudio();arp('down',2200);setTimeout(()=>arp('up',1800),2600)};
startSession.onclick=()=>{getAudio();cards.scrollIntoView({behavior:'smooth'});setTimeout(()=>{const c=document.querySelector('.card');if(c)startCard(c)},450)};
completeSession.onclick=()=>{stopActive();const today=localDateStr();if(!state.attendance.includes(today))state.attendance.push(today);state.totalSessions++;if(state.cycle===1&&!state.completedDays.includes(currentDay))state.completedDays.push(currentDay);if(currentDay>=12){state.nextDay=1;state.cycle++}else state.nextDay=currentDay+1;save();currentDay=state.nextDay;render();window.scrollTo({top:0,behavior:'smooth'})};
render();
</script>
